<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>康复临床工作台 · 小样</title>
<style>
:root{
  --primary:#1e6fd9; --primary-dark:#155aad; --accent:#0ea5b7;
  --bg:#f2f6fb; --card:#ffffff; --text:#1c2733; --muted:#6b7a8d;
  --line:#e3eaf2; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --shadow:0 1px 3px rgba(16,42,67,.08),0 6px 18px rgba(16,42,67,.06);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  padding-bottom:66px;padding-top:52px;
}
/* ---- header ---- */
.appbar{
  position:fixed;top:0;left:0;right:0;z-index:20;height:52px;
  background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff;
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:0 2px 8px rgba(30,111,217,.25);
}
.appbar .logo{
  width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;
}
.appbar .t{font-weight:700;font-size:16px;letter-spacing:.5px}
.appbar .sub{font-size:11px;opacity:.85;margin-top:1px}
.appbar .pt{
  margin-left:auto;font-size:11px;background:rgba(255,255,255,.18);
  padding:4px 10px;border-radius:20px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;
}
/* ---- content ---- */
main{max-width:520px;margin:0 auto;padding:14px 14px 24px}
.section{display:none;animation:fade .25s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;border:1px solid var(--line);
}
.card h3{
  font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.card h3 .n{
  width:22px;height:22px;border-radius:7px;background:var(--primary);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none;
}
.step-desc{font-size:12px;color:var(--muted);margin:-6px 0 14px}
/* ---- form ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#33424f}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:15px;background:#fbfcfe;color:var(--text);outline:none;transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:12px}
.row .field{flex:1}
/* radio pills */
.pills{display:flex;gap:8px}
.pills label{
  flex:1;text-align:center;padding:10px 0;border:1.5px solid var(--line);border-radius:10px;
  font-size:14px;color:var(--muted);cursor:pointer;transition:all .15s;background:#fbfcfe;
}
.pills input{display:none}
.pills input:checked + span{color:#fff}
.pills label:has(input:checked){background:var(--primary);border-color:var(--primary);color:#fff}
/* ---- slider ---- */
.slider-row{display:flex;align-items:center;gap:12px}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;
  background:linear-gradient(to right,var(--accent) var(--fill,0%),var(--line) var(--fill,0%));outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;
  border:3px solid var(--primary);box-shadow:0 2px 6px rgba(16,42,67,.25);cursor:pointer;
}
.slider-val{
  min-width:52px;text-align:center;background:var(--primary);color:#fff;font-weight:700;
  padding:7px 6px;border-radius:10px;font-size:15px;flex:none;
}
.slider-hint{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
/* ---- checklist / exam ---- */
.exam-item{
  display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--line);
}
.exam-item:last-child{border-bottom:none}
.exam-item .chk{
  width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s;cursor:pointer;
}
.exam-item .chk.on{background:var(--primary);border-color:var(--primary);color:#fff}
.exam-item .en{flex:1;font-size:14px}
.exam-item .en small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.exam-item .deg{display:none;flex:none}
.exam-item .deg.show{display:block}
.exam-item select{padding:7px 8px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;background:#fff;outline:none}
/* video card */
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{
  border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;
}
.vcard .thumb{
  aspect-ratio:16/10;background:linear-gradient(135deg,#eaf2ff,#d9f4f6);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--primary);
}
.vcard .vt{padding:8px 10px;font-size:12px;font-weight:600}
.vcard .vt small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
/* ---- scale chips & filter ---- */
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.fchip{
  flex:none;padding:7px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;
  font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;
}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.scale-card{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;margin-bottom:10px;background:#fff;cursor:pointer;transition:all .15s;
}
.scale-card.on{border-color:var(--primary);background:#f0f7ff}
.scale-card .sb{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;
}
.scale-card.on .sb{background:var(--primary);border-color:var(--primary);color:#fff}
.scale-card .sn{flex:1;font-size:14px;font-weight:600}
.scale-card .sn small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.scale-items{display:none;margin:-4px 0 14px;padding:14px;background:#f8fbfe;border:1px dashed var(--line);border-radius:12px}
.scale-items.show{display:block}
/* ---- plan ---- */
.phase{
  border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff;
}
.phase .ph-head{display:flex;align-items:center;gap:8px;padding:12px 14px;color:#fff}
.phase.acute .ph-head{background:var(--danger)}
.phase.sub .ph-head{background:var(--warn)}
.phase.chronic .ph-head{background:var(--ok)}
.phase .ph-head .ph-t{font-weight:700;font-size:14px}
.phase .ph-head .ph-d{margin-left:auto;font-size:11px;opacity:.9}
.phase ul{padding:10px 14px 12px 32px;font-size:13.5px}
.phase li{margin-bottom:5px}
.add-ther{display:flex;gap:8px;margin-top:6px}
.add-ther input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;outline:none}
.add-ther input:focus{border-color:var(--primary)}
.add-ther button{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600}
.therapy-list{margin-top:10px}
.tchip{
  display:inline-flex;align-items:center;gap:6px;background:#eef4ff;color:var(--primary);
  border-radius:20px;padding:6px 12px;font-size:12.5px;margin:0 6px 6px 0;
}
.tchip .x{cursor:pointer;font-weight:700;opacity:.7}
/* ---- buttons ---- */
.btn{
  display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  background:var(--primary);color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(30,111,217,.28);
  transition:transform .08s;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
/* ---- report ---- */
.report{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line);
}
.report h2{font-size:17px;text-align:center;margin-bottom:2px}
.report .r-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1.5px solid var(--line)}
.report h4{
  font-size:14px;color:var(--primary);margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--primary);
}
.report .kv{display:flex;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.report .kv .k{flex:none;width:88px;color:var(--muted)}
.report .kv .v{flex:1}
.report .note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
/* ---- bottom nav ---- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;
  color:var(--muted);font-size:10.5px;cursor:pointer;border-radius:10px;transition:all .15s;
}
.tab .ic{font-size:19px;line-height:1}
.tab.on{color:var(--primary);font-weight:700;background:#eef4ff}
/* ---- modal ---- */
.modal-mask{
  position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:40;display:none;
  align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex}
.modal{
  background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px;
  animation:slideup .25s ease;
}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;margin-bottom:12px}
.modal .close{float:right;font-size:20px;color:var(--muted);cursor:pointer}
.video-box{
  aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#1c2733,#2c3e50);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:8px;
}
.video-box .play{
  width:56px;height:56px;border-radius:50%;background:var(--primary);display:flex;align-items:center;
  justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.video-box .vb-note{font-size:12px;opacity:.85;padding:0 20px;text-align:center}
.modal .hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6}
/* ---- print ---- */
@media print{
  body{padding:0;background:#fff}
  .appbar,.tabbar,.btn-row,.modal-mask{display:none !important}
  main{max-width:none;padding:0}
  .section{display:none !important}
  .section#sec-report{display:block !important}
  .report{box-shadow:none;border:none;padding:0}
  .card{box-shadow:none}
}
/* empty state */
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0}
</style>
</head>
<body>

<div class="appbar">
  <div class="logo">⚕</div>
  <div>
    <div class="t">康复临床工作台</div>
    <div class="sub">S·O·A·P 一体化评估工具</div>
  </div>
  <div class="pt" id="appPatient">未录入</div>
</div>

<main>
  <!-- 1 基础信息 -->
  <section class="section active" id="sec-info">
    <div class="card">
      <h3><span class="n">1</span>基础信息</h3>
      <div class="row">
        <div class="field">
          <label>姓名</label>
          <input type="text" id="fName" placeholder="请输入姓名" value="张三">
        </div>
        <div class="field" style="flex:.6">
          <label>年龄</label>
          <input type="number" id="fAge" min="1" max="120" value="45">
        </div>
      </div>
      <div class="field">
        <label>性别</label>
        <div class="pills">
          <label><input type="radio" name="gender" value="男" checked><span>男</span></label>
          <label><input type="radio" name="gender" value="女"><span>女</span></label>
          <label><input type="radio" name="gender" value="其他"><span>其他</span></label>
        </div>
      </div>
      <div class="field">
        <label>主诉 / 基本情况</label>
        <textarea id="fComplaint" placeholder="如：腰痛伴右下肢放射痛 2 周">腰痛伴右下肢放射痛 2 周</textarea>
      </div>
      <div class="field">
        <label>VAS 疼痛评分（0-10）</label>
        <div class="slider-row">
          <input type="range" id="fVas" min="0" max="10" step="0.5" value="6">
          <div class="slider-val" id="vasVal">6</div>
        </div>
        <div class="slider-hint"><span>无痛</span><span>剧痛</span></div>
      </div>
    </div>
  </section>

  <!-- 2 客观评估 -->
  <section class="section" id="sec-exam">
    <div class="card">
      <h3><span class="n">2</span>客观评估</h3>
      <div class="step-desc">勾选有异常的评估项，并记录程度</div>
      <div id="examList"></div>
    </div>
    <div class="card">
      <h3><span class="n">▶</span>特殊检查视频</h3>
      <div class="step-desc">点击查看检查示范</div>
      <div class="video-grid" id="examVideos"></div>
    </div>
  </section>

  <!-- 3 量表匹配 -->
  <section class="section" id="sec-scale">
    <div class="card">
      <h3><span class="n">3</span>量表精准匹配</h3>
      <div class="step-desc">按疾病类型筛选量表，可多选</div>
      <div class="filter" id="scaleFilter"></div>
      <div id="scaleList"></div>
    </div>
    <div class="card" id="scaleScoreCard" style="display:none">
      <h3><span class="n">✎</span>量表填写</h3>
      <div id="scaleScores"></div>
    </div>
  </section>

  <!-- 4 方案生成 -->
  <section class="section" id="sec-plan">
    <div class="card">
      <h3><span class="n">4</span>康复方案生成</h3>
      <div class="step-desc">基于评估结果自动生成分阶段方案</div>
      <button class="btn" id="btnGenPlan">生成分阶段康复方案</button>
      <div id="planOutput" style="margin-top:14px"></div>
    </div>
    <div class="card">
      <h3><span class="n">＋</span>自定义疗法</h3>
      <div class="step-desc">添加物理因子、运动等个性化疗法</div>
      <div class="add-ther">
        <input type="text" id="therInput" placeholder="如：中频电疗 20min / 臀桥 3×12">
        <button id="btnAddTher">添加</button>
      </div>
      <div class="therapy-list" id="therList"></div>
    </div>
  </section>

  <!-- 5 报告导出 -->
  <section class="section" id="sec-report">
    <div class="card">
      <h3><span class="n">5</span>报告导出</h3>
      <div class="step-desc">汇总评估结果与治疗方案</div>
      <button class="btn" id="btnGenReport">生成完整报告</button>
      <div id="reportOutput" style="margin-top:14px"></div>
    </div>
    <div class="btn-row" id="exportRow" style="display:none;margin-bottom:14px">
      <button class="btn" onclick="window.print()">🖨 导出 PDF / 打印</button>
      <button class="btn ghost" id="btnCopy">复制文本</button>
    </div>
  </section>
</main>

<!-- bottom nav -->
<div class="tabbar">
  <div class="tab on" data-sec="sec-info"><span class="ic">📋</span>基础信息</div>
  <div class="tab" data-sec="sec-exam"><span class="ic">🔍</span>客观评估</div>
  <div class="tab" data-sec="sec-scale"><span class="ic">📊</span>量表匹配</div>
  <div class="tab" data-sec="sec-plan"><span class="ic">💡</span>方案生成</div>
  <div class="tab" data-sec="sec-report"><span class="ic">📄</span>报告导出</div>
</div>

<!-- video modal -->
<div class="modal-mask" id="videoMask">
  <div class="modal">
    <span class="close" id="videoClose">✕</span>
    <h3 id="videoTitle">检查示范</h3>
    <div class="video-box" id="videoBox">
      <div class="play">▶</div>
      <div class="vb-note" id="videoNote">演示视频占位，可在代码顶部 VIDEOS 常量填入真实视频地址</div>
    </div>
    <div class="hint">注：小样中演示视频为占位，正式版将接入真实检查示范视频。</div>
  </div>
</div>

<script>
/* ================= 数据定义（可替换） ================= */
// 演示视频：填入真实 mp4 地址即可自动播放；留空显示占位
const VIDEOS = {
  slr:   { name: '直腿抬高试验',   desc: '腰椎间盘突出筛查', url: '' },
  slump: { name: 'Slump 试验',     desc: '神经张力测试',     url: '' },
  fad:   { name: 'FADIR 试验',     desc: '髋关节撞击筛查',   url: '' },
  thompson: { name: 'Thompson 试验', desc: '跟腱断裂筛查',   url: '' }
};

// 量表数据：按疾病类型筛选
const SCALES = [
  { id:'vas',    name:'VAS 疼痛评分',          disease:'疼痛', desc:'0-10 视觉模拟评分',      items:[{label:'疼痛程度',max:10,step:0.5}] },
  { id:'oddi',   name:'ODI 功能障碍指数',       disease:'疼痛', desc:'腰椎功能障碍',          items:[{label:'功能障碍程度',max:100,step:1}] },
  { id:'hhd',    name:'改良 HHD 徒手肌力',      disease:'骨科', desc:'肌力评定 0-5 级',       items:[{label:'受累肌群力量',max:5,step:0.5}] },
  { id:'rom',    name:'关节活动度 ROM',         disease:'骨科', desc:'主动/被动活动范围',      items:[{label:'活动度受限',max:100,step:1}] },
  { id:'bfc',    name:'Borg 呼吸困难量表',      disease:'心肺', desc:'呼吸困难程度 0-10',     items:[{label:'呼吸困难程度',max:10,step:0.5}] },
  { id:'sixmwt', name:'6 分钟步行试验',         disease:'心肺', desc:'心肺耐力评估',          items:[{label:'步行距离(m)',max:600,step:1}] },
  { id:'bbs',    name:'Berg 平衡量表',          disease:'神经', desc:'平衡功能 0-56 分',       items:[{label:'平衡得分',max:56,step:1}] },
  { id:'adl',    name:'Barthel 指数 ADL',       disease:'神经', desc:'日常生活能力 0-100',    items:[{label:'ADL 得分',max:100,step:1}] }
];
const DISEASES = ['疼痛','骨科','心肺','神经'];

// 方案模板（基于 VAS 分档 + 自定义疗法）
const PLAN_TEMPLATE = {
  acute: {
    title: '急性期', range: '0-2 周',
    items: [
      '制动与姿势教育，避免诱发动作',
      '冰敷 15min，2 次/日，控制炎症',
      '被动关节活动度训练（无痛范围）',
      '物理因子：中频电疗 / 超声波，消炎镇痛'
    ]
  },
  sub: {
    title: '亚急性期', range: '2-6 周',
    items: [
      '恢复关节活动度：牵伸 + 主动 ROM',
      '核心稳定性训练：臀桥、鸟狗式',
      '肌力强化：等长→等张渐进抗阻',
      '本体感觉与平衡训练'
    ]
  },
  chronic: {
    title: '慢性期', range: '6 周+',
    items: [
      '功能性与专项动作模式训练',
      '力量峰值训练 + 耐力训练',
      '重返运动/工作前的功能测试',
      '家庭康复计划与复发预防宣教'
    ]
  }
};

/* ================= 状态 ================= */
const state = {
  patient: { name:'张三', age:45, gender:'男', complaint:'腰痛伴右下肢放射痛 2 周', vas:6 },
  exam: {},        // id -> { done, deg }
  scales: [],      // 选中的量表 id
  scores: {},      // scaleId -> 各 item 值（存数组）
  plan: null,      // 生成的方案
  customTher: []   // 自定义疗法列表
};

/* ================= 通用 ================= */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){
  const t=document.createElement('div');
  t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1c2733;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.25)';
  document.body.appendChild(t);setTimeout(()=>t.remove(),1800);
}

/* tab 切换 */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    tab.classList.add('on');
    const sec=document.getElementById(tab.dataset.sec);
    sec.classList.add('active');
    if(tab.dataset.sec==='sec-plan') renderPlanPreview();
  });
});

/* ================= 1 基础信息 ================= */
function bindInfo(){
  const vas=$('#fVas');
  const upd=()=>{ $('#vasVal').textContent=vas.value; vas.style.setProperty('--fill',(vas.value/10*100)+'%'); state.patient.vas=parseFloat(vas.value); };
  vas.addEventListener('input',upd); upd();
  $('#fName').addEventListener('input',e=>{ state.patient.name=e.target.value; $('#appPatient').textContent=e.target.value||'未录入'; });
  $('#fAge').addEventListener('input',e=>state.patient.age=e.target.value);
  document.querySelectorAll('input[name=gender]').forEach(r=>r.addEventListener('change',e=>state.patient.gender=e.target.value));
  $('#fComplaint').addEventListener('input',e=>state.patient.complaint=e.target.value);
}

/* ================= 2 客观评估 ================= */
const EXAM_ITEMS = [
  { id:'palp', name:'触诊',        desc:'压痛点 / 肌肉紧张' },
  { id:'rom',  name:'活动度',      desc:'关节活动范围受限' },
  { id:'musc', name:'肌力',        desc:'肌力下降 / 萎缩' },
  { id:'temp', name:'皮温',        desc:'局部温度异常' },
  { id:'adl',  name:'ADL',         desc:'日常生活能力受限' }
];
function renderExam(){
  const box=$('#examList');
  box.innerHTML = EXAM_ITEMS.map(it=>{
    const s=state.exam[it.id]||{done:false,deg:''};
    return `<div class="exam-item">
      <div class="chk ${s.done?'on':''}" data-id="${it.id}">✓</div>
      <div class="en">${it.name}<small>${it.desc}</small></div>
      <select class="deg ${s.done?'show':''}" data-id="${it.id}">
        <option value="">程度…</option>
        <option ${s.deg==='轻度'?'selected':''}>轻度</option>
        <option ${s.deg==='中度'?'selected':''}>中度</option>
        <option ${s.deg==='重度'?'selected':''}>重度</option>
      </select>
    </div>`;
  }).join('');
  box.querySelectorAll('.chk').forEach(c=>c.addEventListener('click',()=>{
    const id=c.dataset.id;
    state.exam[id]=state.exam[id]||{done:false,deg:''};
    state.exam[id].done=!state.exam[id].done;
    c.classList.toggle('on',state.exam[id].done);
    const sel=box.querySelector(`select.deg[data-id="${id}"]`);
    sel.classList.toggle('show',state.exam[id].done);
    if(!state.exam[id].done){ sel.value=''; state.exam[id].deg=''; }
  }));
  box.querySelectorAll('select').forEach(s=>s.addEventListener('change',e=>{
    state.exam[e.target.dataset.id]=state.exam[e.target.dataset.id]||{done:true};
    state.exam[e.target.dataset.id].deg=e.target.value;
  }));
  // 特殊检查视频
  const vg=$('#examVideos');
  vg.innerHTML = Object.entries(VIDEOS).map(([k,v])=>`
    <div class="vcard" data-vid="${k}">
      <div class="thumb">▶</div>
      <div class="vt">${v.name}<small>${v.desc}</small></div>
    </div>`).join('');
  vg.querySelectorAll('.vcard').forEach(c=>c.addEventListener('click',()=>openVideo(c.dataset.vid)));
}

/* video modal */
function openVideo(id){
  const v=VIDEOS[id];
  $('#videoTitle').textContent=v.name;
  const box=$('#videoBox');
  if(v.url){
    box.innerHTML=`<video src="${esc(v.url)}" controls autoplay style="width:100%;height:100%;border-radius:12px"></video>`;
  }else{
    box.innerHTML=`<div class="play">▶</div><div class="vb-note">${v.name} · ${v.desc}<br><br>演示视频占位，可在代码顶部 VIDEOS 常量填入真实视频地址</div>`;
  }
  $('#videoMask').classList.add('show');
}
$('#videoClose').addEventListener('click',()=>$('#videoMask').classList.remove('show'));
$('#videoMask').addEventListener('click',e=>{ if(e.target.id==='videoMask')$('#videoMask').classList.remove('show'); });

/* ================= 3 量表匹配 ================= */
function renderScaleFilter(){
  const box=$('#scaleFilter');
  box.innerHTML = ['全部',...DISEASES].map((d,i)=>`<div class="fchip ${i===0?'on':''}" data-f="${i===0?'':d}">${d}</div>`).join('');
  box.querySelectorAll('.fchip').forEach(c=>c.addEventListener('click',()=>{
    box.querySelectorAll('.fchip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    renderScaleList(c.dataset.f);
  }));
}
function renderScaleList(filter=''){
  const list=SCALES.filter(s=>!filter||s.disease===filter);
  const box=$('#scaleList');
  box.innerHTML = list.map(s=>{
    const on=state.scales.includes(s.id);
    return `<div class="scale-card ${on?'on':''}" data-id="${s.id}">
      <div class="sb">✓</div>
      <div class="sn">${s.name}<small>${s.disease} · ${s.desc}</small></div>
    </div>`;
  }).join('') + (list.length?'':`<div class="empty">该分类暂无量表</div>`);
  box.querySelectorAll('.scale-card').forEach(c=>c.addEventListener('click',()=>{
    const id=c.dataset.id;
    const i=state.scales.indexOf(id);
    if(i>=0){ state.scales.splice(i,1); delete state.scores[id]; }
    else state.scales.push(id);
    renderScaleList(filter); renderScaleScores();
  }));
}
function renderScaleScores(){
  const card=$('#scaleScoreCard'), box=$('#scaleScores');
  if(!state.scales.length){ card.style.display='none'; return; }
  card.style.display='block';
  box.innerHTML = state.scales.map(sid=>{
    const sc=SCALES.find(x=>x.id===sid);
    if(!sc) return '';
    const vals=state.scores[sid]||sc.items.map(()=>0);
    const html=sc.items.map((it,idx)=>`
      <div class="field" style="margin-bottom:10px">
        <label>${sc.name} · ${it.label}</label>
        <div class="slider-row">
          <input type="range" class="srange" min="0" max="${it.max}" step="${it.step}" value="${vals[idx]}"
            data-sid="${sid}" data-idx="${idx}">
          <div class="slider-val sv">${vals[idx]}</div>
        </div>
        <div class="slider-hint"><span>0</span><span>${it.max}</span></div>
      </div>`).join('');
    return `<h4 style="font-size:13.5px;color:var(--primary);margin:4px 0 6px">${sc.name}</h4>${html}`;
  }).join('');
  box.querySelectorAll('.srange').forEach(r=>{
    r.style.setProperty('--fill',(r.value/r.max*100)+'%');
    r.addEventListener('input',()=>{
      const v=parseFloat(r.value);
      r.style.setProperty('--fill',(v/r.max*100)+'%');
      const sv=r.closest('.field').querySelector('.sv'); if(sv) sv.textContent=v;
      state.scores[r.dataset.sid]=state.scores[r.dataset.sid]||[];
      state.scores[r.dataset.sid][+r.dataset.idx]=v;
    });
  });
}

/* ================= 4 方案生成 ================= */
function buildPlan(){
  const vas=state.patient.vas;
  const custom=state.customTher.slice();
  const examStr = Object.entries(state.exam).filter(([k,v])=>v.done).map(([k,v])=>{
    const name=(EXAM_ITEMS.find(x=>x.id===k)||{}).name||k;
    return name+(v.deg?`(${v.deg})`:'');
  });
  const plan={
    vas, examStr, custom,
    acute: PLAN_TEMPLATE.acute.items.slice(),
    sub: PLAN_TEMPLATE.sub.items.slice(),
    chronic: PLAN_TEMPLATE.chronic.items.slice()
  };
  // 根据 VAS 档位插入针对性条目
  if(vas>=7){ plan.acute.unshift('止痛与制动为主，避免负重'); }
  else if(vas>=4){ plan.acute.unshift('适度活动，避免久坐久站'); }
  else { plan.acute.push('轻量活动与日常功能维持'); }
  // 把自定义疗法并入各阶段末尾
  ['acute','sub','chronic'].forEach(k=>{
    custom.forEach(t=>plan[k].push('自定义：'+t));
  });
  return plan;
}
function renderPlanPreview(){
  const out=$('#planOutput');
  if(!state.plan){ out.innerHTML='<div class="empty">尚未生成方案 — 点击上方按钮生成</div>'; return; }
  const p=state.plan;
  const ph=html=>`<div class="phase ${html.key}"><div class="ph-head"><span class="ph-t">${html.title}</span><span class="ph-d">${html.range}</span></div><ul>${html.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
  out.innerHTML=`
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">患者：${esc(state.patient.name)} · VAS ${p.vas} · ${p.examStr.join('、')||'无异常项'}</div>
    ${ph({key:'acute',...PLAN_TEMPLATE.acute,items:p.acute})}
    ${ph({key:'sub',...PLAN_TEMPLATE.sub,items:p.sub})}
    ${ph({key:'chronic',...PLAN_TEMPLATE.chronic,items:p.chronic})}
  `;
}
$('#btnGenPlan').addEventListener('click',()=>{
  state.plan=buildPlan();
  renderPlanPreview();
  toast('方案已生成，可切到报告页导出');
});
/* 自定义疗法 */
function renderTher(){
  const box=$('#therList');
  box.innerHTML = state.customTher.map((t,i)=>`<span class="tchip">${esc(t)}<span class="x" data-i="${i}">✕</span></span>`).join('') || '';
  box.querySelectorAll('.x').forEach(x=>x.addEventListener('click',()=>{
    state.customTher.splice(+x.dataset.i,1); renderTher();
  }));
}
$('#btnAddTher').addEventListener('click',()=>{
  const v=$('#therInput').value.trim();
  if(!v){ toast('请输入疗法内容'); return; }
  state.customTher.push(v);
  $('#therInput').value='';
  renderTher();
  if(state.plan){ state.plan=buildPlan(); renderPlanPreview(); }
});
$('#therInput').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#btnAddTher').click(); });

/* ================= 5 报告导出 ================= */
function buildReportHTML(){
  const p=state.patient;
  const examItems = EXAM_ITEMS.filter(it=>state.exam[it.id]&&state.exam[it.id].done)
    .map(it=>`${it.name}（${state.exam[it.id].deg||'异常'}）`);
  const scaleRows = state.scales.map(sid=>{
    const sc=SCALES.find(x=>x.id===sid);
    const vals=(state.scores[sid]||[]);
    const detail=vals.length?`${sc.items[0].label} ${vals[0]}/${sc.items[0].max}`:'已选未填';
    return `<div class="kv"><span class="k">${sc.name}</span><span class="v">${detail}</span></div>`;
  }).join('');
  const plan=state.plan;
  const planHTML = plan ? `
    <h4>康复方案</h4>
    <div class="kv"><span class="k">VAS</span><span class="v">${plan.vas} 分</span></div>
    ${Object.keys(PLAN_TEMPLATE).map(k=>`
      <div class="kv"><span class="k">${PLAN_TEMPLATE[k].title}</span><span class="v">${plan[k].join('；')}</span></div>
    `).join('')}
  ` : `<h4>康复方案</h4><div class="kv"><span class="k">状态</span><span class="v">未生成</span></div>`;
  const now=new Date();
  const dateStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  return `
    <div class="report">
      <h2>康复评估报告</h2>
      <div class="r-sub">康复临床工作台 · 生成日期 ${dateStr}</div>
      <h4>基础信息</h4>
      <div class="kv"><span class="k">姓名</span><span class="v">${esc(p.name)}</span></div>
      <div class="kv"><span class="k">年龄 / 性别</span><span class="v">${p.age} 岁 · ${p.gender}</span></div>
      <div class="kv"><span class="k">主诉</span><span class="v">${esc(p.complaint)||'—'}</span></div>
      <div class="kv"><span class="k">VAS 疼痛</span><span class="v">${p.vas} / 10</span></div>
      <h4>客观评估</h4>
      ${examItems.length?examItems.map(x=>`<div class="kv"><span class="k">异常项</span><span class="v">${esc(x)}</span></div>`).join(''):'<div class="kv"><span class="k">结果</span><span class="v">未记录异常</span></div>'}
      <h4>量表评估</h4>
      ${scaleRows||'<div class="kv"><span class="k">结果</span><span class="v">未选择量表</span></div>'}
      ${planHTML}
      <div class="note">本报告由康复临床工作台小样自动生成，仅供演示与学习，不构成医疗诊断或治疗建议。</div>
    </div>`;
}
function renderReport(){
  $('#reportOutput').innerHTML=buildReportHTML();
  $('#exportRow').style.display='flex';
}
$('#btnGenReport').addEventListener('click',()=>{ renderReport(); toast('报告已生成'); });
$('#btnCopy').addEventListener('click',()=>{
  const txt=buildReportHTML().replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('已复制到剪贴板'),()=>toast('复制失败，请长按选择'));
  }else{
    toast('当前浏览器不支持自动复制');
  }
});

/* ================= init ================= */
bindInfo();
renderExam();
renderScaleFilter();
renderScaleList();
renderTher();
</script>
</body>
</html>
